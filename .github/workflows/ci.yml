name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  production-promotion:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require staging as the production source
        run: test "${{ github.head_ref }}" = "staging"

  validate:
    # The pinned Playwright browser does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check
        shell: bash
        run: |
          # Keep this pattern in sync with Biome-supported file types (see `/biome.json`).
          EXT_PATTERN='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|json|jsonc|css)$'
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E "$EXT_PATTERN" || true)

          if [ ${#changed_files[@]} -eq 0 ] || [ -z "${changed_files[0]}" ]; then
            echo "Skipping Biome check: no files matching ${EXT_PATTERN} were modified in this PR."
            exit 0
          fi

          echo "Running Biome on ${#changed_files[@]} changed files..."
          npx biome check "${changed_files[@]}"

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser for responsive navigation regressions
        run: npx playwright install --with-deps chromium

      - name: Responsive UI regressions
        run: npx playwright test tests/responsive-navigation.spec.js tests/kaori-mobile.spec.js tests/media-search.spec.js tests/feed-video-loading.spec.js tests/kaori-launcher.spec.js tests/chrome-extension.spec.js tests/discovery-filters.spec.js --reporter=list,html

      - name: Upload responsive UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
